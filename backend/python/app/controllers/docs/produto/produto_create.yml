tags:
  - Produtos
summary: Cadastra um novo produto
description: Cria um novo produto no catálogo. A descrição e o valor de venda são obrigatórios. O SKU deve ser único, caso informado.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - descricao
        - valor_venda
      properties:
        descricao:
          type: string
          example: "Bicicleta Oggi Hacker Sport 29"
        valor_venda:
          type: number
          format: float
          example: 1850.00
        categoria_id:
          type: integer
          example: 1
        subcategoria_id:
          type: integer
          example: 2
        marca_id:
          type: integer
          example: 3
        sku:
          type: string
          example: "OGG-HCK-29-PRT"
        custo_compra:
          type: number
          format: float
          example: 1200.00
        valor_instalacao:
          type: number
          format: float
          example: 0.00
        estoque_atual:
          type: integer
          example: 5
        estoque_minimo:
          type: integer
          example: 2
        observacao:
          type: string
          example: "Cor preta com detalhes em azul"
        especificacao_1:
          type: string
          example: "Aro 29"
        especificacao_2:
          type: string
          example: "Quadro Alumínio"
        especificacao_3:
          type: string
          example: "21 Marchas"
responses:
  201:
    description: Produto criado com sucesso
  400:
    description: Erro de validação nos dados enviados
  409:
    description: Conflito - Já existe um produto com este SKU
  422:
    description: Chaves estrangeiras (categoria, subcategoria, marca) não encontradas ou valores negativos inválidos